# Alternate site name
alternate: StarlingLin

open_graph:
  #twitter_id:
  #google_plus:
  #fb_admins:
  #fb_app_id:

# Assets
statics: / # //cdn.jsdelivr.net/gh/StarlingLin/StarlingLin.github.io@latest/
css: css
js: js
images: images

# themes/shoka/source/images/***
favicon:
  apple_touch_icon: /apple-touch-icon.png
  #safari_pinned_tab: /logo.svg
  #android_manifest: /manifest.json
  #ms_browserconfig: /browserconfig.xml

# Dark Mode
# By default, the page judges whether to turn on the dark mode according to the device settings or user selection
# if `true`, the page will be displayed directly as Dark Mode, unless the user makes another choice
darkmode: false

# By default the page will automatically scroll to the last viewed position
# if `false`, automatic positioning will be turned off
auto_scroll: true

# Whether to show the loading cat
loader:
  start: true # When entering the page
  switch: false # When switching to another page

# click with Firework
fireworks:
  enable: true
  color:
    # - "rgba(255,182,185,.9)"
    # - "rgba(250,227,217,.9)"
    # - "rgba(187,222,214,.9)"
    # - "rgba(138,198,209,.9)"

font:
  enable: true
  # Font options:
  # `external: true` will load this font family from `host` above.
  # `family: Times New Roman`. Without any quotes.
  # `size: x.x`. Use `em` as unit. Default: 1 (16px)

  # Global font settings used for all elements inside <body>.
  global:
    external: false
    family: Mulish
    size:

  # Font settings for alternate title.
  logo:
    external: false
    family: Fredericka the Great
    size: 3.5

  # Font settings for site title.
  title:
    external: false
    family: Noto Serif JP
    size: 2.5

  # Font settings for headlines (<h1> to <h6>).
  headings:
    external: false
    family: Noto Serif SC
    size:

  # Font settings for posts.
  posts:
    external: true
    family:

  # Font settings for <code> and code blocks.
  codes:
    external: false
    family: Inconsolata

# project of https://www.iconfont.cn/
# Legacy projects: //at.alicdn.com/t/font_<iconfont>.css
# New projects can override the asset base URL (without the file extension).
iconfont: "5222161_8l079jlll9n"
iconfont_url: "//at.alicdn.com/t/c/font_5222161_8l079jlll9n"

menu:
  home: / || home
  about: /about/ || user
  posts:
    default: / || feather
    archives: /archives/ || list-alt
    categories: /categories/ || th
    tags: /tags/ || tags
  moments: /moments/ || smile
  friends: /friends/ || heart
  links: https://www.ciallo.org.cn || game
  travellings: https://www.travellings.cn/go.html || travelling
  contact:
    default: / || comments
    mail: mailto:2222040903@qq.com || envelope
    chat: https://chat.starlinglin.top || paper-plane

# Social Links
# Usage: `Key: permalink || icon || color`
# Key is the link label showing to end users.
# Value before `||` delimiter is the target permalink,
# secend value is the name of Font icon.
social:
  github: https://github.com/StarlingLin || github || "#191717"
  #google: https://plus.google.com/yourname || google
  #twitter: https://twitter.com/yourname || twitter || "#00aff0"
  #zhihu: https://www.zhihu.com/people/yourname || zhihu || "#1e88e5"
  music: https://music.163.com/#/user/home?id=3246882964 || cloud-music || "#e60026"
  #weibo: https://weibo.com/yourname || weibo || "#ea716e"
  #about: https://about.me/StarlingLin || address-card || "#3b5998"
  email: https://chat.starlinglin.top || envelope || "#55acd5"
  #facebook: https://www.facebook.com/yourname || facebook
  #stackoverflow: https://stackoverflow.com/yourname || stack-overflow
  #youtube: https://youtube.com/yourname || youtube
  #instagram: https://instagram.com/yourname || instagram
  #skype: skype:yourname?call|chat || skype
  #douban: https://www.douban.com/people/yourname/ || douban
  rss: /atom.xml || rss || '#f26522'

sidebar:
  # Sidebar Position.
  # position: left
  position: right
  # Replace the default avatar image and set the url here.
  avatar: avatar.jpg

widgets:
  # if true, will show random posts
  random_posts: true
  # if true, will show recent comments
  recent_comments: true
  recent_comments_count: 8

footer:
  # Specify the date when the site was setup. If not defined, current year will be used.
  since: 2023
  icon:
    name: sakura rotate
    # Change the color of icon, using Hex Code.
    color: "#ffc0cb"
  # Dependencies: https://github.com/theme-next/hexo-symbols-count-time
  count: true
  powered: true

post:
  # Dependencies: https://github.com/theme-next/hexo-symbols-count-time
  count: true

# Moments / status updates from source/_moments/*.md
moments:
  title: 动态
  description: 记录生活的基米
  per_page: 10

# Reward (Donate)
reward:
  # If true, reward will be displayed in every article by default.
  enable: true
  account:
    wechatpay: /wechatpay.png
    alipay: /alipay.png
    # paypal: /paypal.png

# TagCloud settings for tags page.
tagcloud:
  # All values below are same as default, change them by yourself.
  min: 16 # Minimun font size in px
  max: 22 # Maxium font size in px
  start: "#72cecf" # Start color (hex, rgba, hsla or color keywords)
  end: "#ffbac3" # End color (hex, rgba, hsla or color keywords)
  amount: 200 # Amount of tags, change it if you have more than 200 tags

# ---------------------------------------------------------------
# Third Party Plugins & Services Settings
# ---------------------------------------------------------------

# Creative Commons 4.0 International License.
# See: https://creativecommons.org/share-your-work/licensing-types-examples
# Available values of license: by | by-nc | by-nc-nd | by-nc-sa | by-nd | by-sa | zero
# You can set a language value if you prefer a translated version of CC license, e.g. deed.zh
# CC licenses are available in 39 languages, you can find the specific and correct abbreviation you need on https://creativecommons.org
creative_commons:
  license: by-nc-sa
  language: deed.zh

# Comments
# Waline
# Documentation: https://waline.js.org/
waline:
  serverURL: https://comment.starlinglin.top
  lang: zh-CN
  locale:
    placeholder: "请在这里输入评论呦~ ヽ(○´∀`)ﾉ♪"
  dark: 'html[data-theme="dark"]'
  pageSize: 10
  commentSorting: latest
  meta:
    - nick
    - mail
    - link
  requiredMeta:
    - nick
    - mail
  login: enable
  # Keep the imported Counter paths in sync with Shoka's LOCAL.path.
  pageview: true

# bgm
audio:
  - title: StarlingLin喜欢的音乐
    list:
      - https://music.163.com/#/playlist?id=4902194129
  # - title: 列表2
  #   list:
  #    - https://music.163.com/#/playlist?id=2031842656

# random image api
image_server: "https://t.mwm.moe/fj/"

# Algolia Search
# For more information: https://www.algolia.com
search:
  hits:
    per_page: 10

# Dependencies: https://github.com/amehime/hexo-renderer-multi-markdown-it
pangu: false

# Quicklink Support
# For more information: https://github.com/GoogleChromeLabs/quicklink
quicklink:
  # Custom a time in milliseconds by which the browser must execute prefetching.
  timeout: 3000
  # Default (true) will attempt to use the fetch() API if supported (rather than link[rel=prefetch]).
  priority: true

  # For more flexibility you can add some patterns (RegExp, Function, or Array) to ignores.
  # See: https://github.com/GoogleChromeLabs/quicklink#custom-ignore-patterns
  ignores:

# ---------------------------------------------------------------
# analytics & SEO Settings
# ---------------------------------------------------------------
baidu_analytics: # <app_id>

# Disable Baidu transformation on mobile devices.
disable_baidu_transformation: true

# Automatically add external URL with Base64 encrypt & decrypt.
exturl: true

# Google Webmaster tools verification.
# See: https://www.google.com/webmasters
google_site_verification:

# Bing Webmaster tools verification.
# See: https://www.bing.com/webmaster
bing_site_verification:

# Yandex Webmaster tools verification.
# See: https://webmaster.yandex.ru
yandex_site_verification:

# Baidu Webmaster tools verification.
# See: https://ziyuan.baidu.com/site
baidu_site_verification:

# Enable baidu push so that the blog will push the url to baidu automatically which is very helpful for SEO.
baidu_push: false

#! ---------------------------------------------------------------
#! Split core scripts so the browser can fetch them in parallel from a
#! configurable CDN. Disable `advVendors` to fall back to Shoka's original
#! jsDelivr combine request.
#! ---------------------------------------------------------------
advVendors:
  enable: true
  npm: https://unpkg.com/
  github: https://cdn.jsdelivr.net/gh/
  combine: https://cdn.jsdelivr.net/
  preconnect:
    - https://cdn.staticfile.net
  js:
    pace:
      src: https://cdn.staticfile.net/pace/1.0.2/pace.min.js
      defer: true
      integrity: sha384-5DyzDgtTHw1bbnR1u2aQPxi5+e1KVPsygV5Pioo5W+5ua3sN5AHF05kzM0QfXXqm
    pjax:
      src: https://cdn.staticfile.net/pjax/0.2.8/pjax.min.js
      defer: true
      integrity: sha384-PX09VH9WyqnmDCYeEn/EPioJLSHIfqN8Z6j9jG19dDOMYisDt4wxZ0U/yGXbNo6h
    fetch:
      src: https://cdn.staticfile.net/fetch/3.4.0/fetch.min.js
      defer: true
      integrity: sha384-OR74H0hMrhtZTU4A+07hPxAOYzKGDS487pTnTKk6+giYQ+Buby/yTOlRyzHSfQ/+
    anime:
      src: https://cdn.staticfile.net/animejs/3.2.0/anime.min.js
      defer: true
      integrity: sha384-JmTzX6unfJDiDQMoiypqCUI502SrA0RB+F//kF3GrhGq5FRh2rTca4us326Qg7Dl
    algolia:
      src: https://cdn.staticfile.net/algoliasearch/4.12.1/algoliasearch-lite.umd.min.js
      defer: true
      integrity: sha384-ubF7ExR9Jzm4aPsY1+ZSPb1fInnnjkh0HPZjPIdXCx/ynvYh1T1ytIQrif9T5hnt
    instantsearch:
      src: https://cdn.staticfile.net/instantsearch.js/4.39.0/instantsearch.production.min.js
      defer: true
      integrity: sha384-OAgm4iI+xrbmRcICcMW/JyOXPBNfKiOSEhnGb0XyaGK75ADf4KGLKEAPIraIDPEU
    lazyload:
      src: https://cdn.staticfile.net/lozad.js/1.16.0/lozad.min.js
      defer: true
      integrity: sha384-cVYgPFZPhwM7B9xTuYXb1bcy5yui7JGXyRJYo2CCTHJT8FS9SDxDsQksUMrmFgwG
    quicklink:
      src: https://cdn.staticfile.net/quicklink/2.2.0/quicklink.umd.js
      defer: true
      integrity: sha384-TNJDSdqmJV17VmTae6yyCXIxv2+xWz0q/NgDSkHvjiP9O8BbAgljEy30hRi/8cAB

vendorsList:
  js:
    # ECharts stays page-specific; source/about/index.md already loads it only where needed.
    - pace
    - pjax
    - fetch
    - anime
    - lazyload
    - quicklink

vendors:
  css:
    waline: https://unpkg.com/@waline/client@3/dist/waline.css
    katex: npm/katex@0.12.0/dist/katex.min.css
    comment: css/comment.css
    fancybox: combine/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css,npm/justifiedGallery@3.8.1/dist/css/justifiedGallery.min.css
  js:
    pace: npm/pace-js@1.0.2/pace.min.js
    pjax: npm/pjax@0.2.8/pjax.min.js
    fetch: npm/whatwg-fetch@3.4.0/dist/fetch.umd.min.js
    anime: npm/animejs@3.2.0/lib/anime.min.js
    algolia: npm/algoliasearch@4/dist/algoliasearch-lite.umd.js
    instantsearch: npm/instantsearch.js@4/dist/instantsearch.production.min.js
    lazyload: npm/lozad@1/dist/lozad.min.js
    quicklink: npm/quicklink@2/dist/quicklink.umd.js
    fancybox: combine/npm/jquery@3.5.1/dist/jquery.min.js,npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js,npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js
    waline: https://unpkg.com/@waline/client@3/dist/waline.umd.js
    copy_tex: npm/katex@0.12.0/dist/contrib/copy-tex.min.js
    chart: npm/frappe-charts@1.5.0/dist/frappe-charts.min.iife.min.js
    echarts: npm/echarts@5.2.2/dist/echarts.min.js
